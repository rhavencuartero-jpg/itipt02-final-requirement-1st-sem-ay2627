
<ion-content [fullscreen]="true">
  <ion-grid class="login-page">
    <ion-grid class="login-card-wrap">
      <ion-grid class="icon-orbit" aria-hidden="true">
        <ion-icon name="book-outline" class="orbit-icon orbit-icon-one"></ion-icon>
        <ion-icon name="library-outline" class="orbit-icon orbit-icon-two"></ion-icon>
        <ion-icon name="bookmark-outline" class="orbit-icon orbit-icon-three"></ion-icon>
        <ion-icon name="albums-outline" class="orbit-icon orbit-icon-four"></ion-icon>
        <ion-icon name="heart-outline" class="orbit-icon orbit-icon-five cute-orbit-icon"></ion-icon>
        <ion-icon name="heart-circle-outline" class="orbit-icon orbit-icon-six cute-orbit-icon"></ion-icon>
      </ion-grid>

      <ion-card class="login-card">
        <ion-card-header>
          <ion-card-title class="login-title">Login</ion-card-title>
        </ion-card-header>

        <ion-card-content class="login-card-content">
          <ion-item class="input-box" lines="none">
            <ion-icon name="person" class="input-icon" slot="start"></ion-icon>
            <ion-input
              type="text"
              placeholder="Username"
              [(ngModel)]="username"
              name="username"
              autocomplete="username"
              enterkeyhint="next"
              required
              (keydown.enter)="focusPassword($event)"
            ></ion-input>
          </ion-item>

          <ion-item class="input-box" lines="none">
            <ion-icon name="lock-closed" class="input-icon" slot="start"></ion-icon>
            <ion-input
              #passwordInput
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Password"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              enterkeyhint="go"
              required
              (keydown.enter)="login()"
            ></ion-input>
            <ion-button
              class="visibility-button"
              fill="clear"
              slot="end"
              type="button"
              aria-label="Toggle password visibility"
              (click)="togglePassword()"
            >
              <ion-icon [name]="showPassword ? 'eye' : 'eye-off'"></ion-icon>
            </ion-button>
          </ion-item>

          <ion-grid class="signup-text">
            <ion-row>
              <ion-col class="signup-line">
                <ion-text class="signup-copy">Don't have an account?</ion-text>
                <ion-button class="link-button" fill="clear" routerLink="/signup" href="/signup">
                  Sign Up
                </ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>

          <ion-grid class="forgot-text">
            <ion-row>
              <ion-col>
                <ion-button class="link-button" fill="clear" routerLink="/forgot-password" href="/forgot-password">
                  Forgot Password?
                </ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>

          <ion-button class="login-button" expand="block" type="button" (click)="login()">
            Log in
          </ion-button>
        </ion-card-content>
      </ion-card>
    </ion-grid>
  </ion-grid>
</ion-content>
